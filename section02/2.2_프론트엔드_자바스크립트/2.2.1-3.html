<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script>
  // 즉시 실행 함수를 async로 감싸서 await 사용을 가능하게 한다
  (async () => {
    try {
      // axios.post(url, dat): POST 요청을 보내는 메서드
      // 첫 번째 인수(요청을 보내 서버 url), 두 번째 인수(서버로 전송할 데이터)
      const result = await axios.post("https://www.zerocho.com/api/post/json", {
        name: "kimyohan",
        birth: 1992,
      });
      console.log(result);
      console.log(result.data); // 서버가 반환한 실제 응답 데이터만 출력
    } catch (error) {
      console.log(error);
    }
  })();
</script>
